<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f4fa3">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}body{-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Formulario Consulta PRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: un celular centrado con el formulario por pasos; barra de progreso arriba y botones abajo */
:root{
  --bg:#e9ecf2; --phone:#ffffff; --ink:#18202e; --muted:#5d6678; --line:#dfe2ea; --soft:#f1f3f7;
  --accent:#1f4fa3; --accent-ink:#ffffff; --warn-bg:#fff4d6; --warn-ink:#7a5200; --ok:#1d7a46; --bad:#b3261e;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"Public Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1118; --phone:#171d28; --ink:#e7eaf1; --muted:#9aa3b5; --line:#2a3242; --soft:#212938;
  --accent:#7aa5f0; --accent-ink:#0d1118; --warn-bg:#3a2f12; --warn-ink:#f2d07a; --ok:#3fb172; --bad:#f08077; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1118; --phone:#171d28; --ink:#e7eaf1; --muted:#9aa3b5; --line:#2a3242; --soft:#212938;
  --accent:#7aa5f0; --accent-ink:#0d1118; --warn-bg:#3a2f12; --warn-ink:#f2d07a; --ok:#3fb172; --bad:#f08077; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px;display:grid;justify-items:center;gap:12px}
.demo{max-width:420px;width:100%;background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:8px 12px;font-size:13px}
.phone{width:100%;max-width:400px;background:var(--phone);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 40px rgba(10,20,40,.18);overflow:hidden;display:grid;grid-template-rows:auto auto 1fr auto;min-height:680px}
.top{background:var(--accent);color:var(--accent-ink);padding:14px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top b{font-family:var(--display);font-weight:800;letter-spacing:.01em}
.top span{font-size:12px;opacity:.9}
.prog{height:5px;background:var(--soft)} .prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.body{padding:18px;display:grid;gap:14px;align-content:start}
h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;text-wrap:balance}
.step{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.q{display:grid;gap:7px}
.q > label,.ql{font-weight:600}
input[type=text],input[type=password],input[type=tel],select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--phone);color:var(--ink);width:100%}
.opts{display:grid;gap:7px}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-weight:500}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.opt input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.read{background:var(--soft);border-radius:10px;padding:12px;font-style:italic}
.small{font-size:12.5px;color:var(--muted)}
.gps{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ok)}
.gps::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.grid5{display:grid;gap:10px}
.cand{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:7px}
.cand b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:block;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.photo{border:2px dashed var(--line);border-radius:12px;min-height:150px;display:grid;place-items:center;text-align:center;padding:12px;color:var(--muted);cursor:pointer;overflow:hidden}
.photo img{width:100%;max-width:340px;aspect-ratio:85.6/53.98;object-fit:cover;border-radius:8px}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap}
.photo-btns button{flex:1 1 140px;padding:11px 12px;border-radius:10px}
.photo-btns button.cam{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.size{font-size:12.5px;color:var(--ok);font-weight:600}
.verif{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:#fff;border:2px solid #1f4fa3;color:#1f2a44;text-decoration:none}
.verif img{width:46px;height:auto;flex:none}
.verif b{display:block;font-size:16px;color:#1f4fa3}
.verif span{font-size:13px;color:#4a5568}
.link{display:block;text-align:center;padding:11px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);font-weight:600;text-decoration:none}
@media (max-width:520px){.page{padding:0;gap:0}.demo{border-radius:0;max-width:none}
  .phone{max-width:none;border:0;border-radius:0;box-shadow:none;min-height:100vh;min-height:100dvh}
  .top{padding-top:calc(14px + env(safe-area-inset-top,0px))}.nav{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
.err{color:var(--bad);font-size:13px;font-weight:600}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--phone);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cam-ov{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:grid;grid-template-rows:auto 1fr auto auto;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cam-t{font-family:var(--display);font-weight:800;font-size:18px;text-align:center}
.cam-box{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;border-radius:14px}
.cam-box video{width:100%;height:100%;object-fit:contain;background:#000}
.cam-dim{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;font-size:12.5px;font-weight:600;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:999px}
.cam-guide{position:absolute;width:86%;max-width:520px;aspect-ratio:85.6/53.98;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
.cam-h{margin:0;text-align:center;font-size:14px;opacity:.9}
.cam-b{display:flex;gap:10px}.cam-b button{flex:1;padding:14px}.cam-b .cx{background:#222;color:#fff;border-color:#444}
.hint{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.nav{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
button{font:inherit;font-weight:600;border-radius:12px;padding:13px 14px;cursor:pointer;border:1px solid var(--line);background:var(--phone);color:var(--ink);flex:1}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:2}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.done{display:grid;justify-items:center;text-align:center;gap:10px;padding-top:40px}
.done .ck{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--ok) 15%,transparent);display:grid;place-items:center}
.done .ck svg{width:38px;height:38px}
.counter{font-family:var(--display);font-size:34px;font-weight:800}
</style>

<div class="page">
  <p class="demo"><b>Vista previa.</b> Así verá el encuestador la app en su celular. Toca los botones para recorrerla. No guarda ningún dato.</p>
  <form class="phone" id="app" novalidate>
    <div class="top"><b>Consulta PRM</b><span id="who">Sin sesión</span></div>
    <div class="prog"><i id="bar" style="width:0%"></i></div>
    <div class="body" id="screen"></div>
    <div class="nav"><button type="button" id="back">Atrás</button><button type="button" class="pri" id="next">Entrar</button></div>
  </form>
</div>

<script>
(() => {
  const CANDS=["Carolina Mejía","David Collado","Raquel Peña","Wellington Arnaud","Guido Gómez Mazara"];
  const GES=["Excelente","Buena","Regular","Mala","No conoce su gestión"];
  // Las 31 provincias y el Distrito Nacional.
  const PROVS=["Azua","Bahoruco","Barahona","Dajabón","Distrito Nacional","Duarte","El Seibo","Elías Piña","Espaillat","Hato Mayor","Hermanas Mirabal","Independencia","La Altagracia","La Romana","La Vega","María Trinidad Sánchez","Monseñor Nouel","Monte Cristi","Monte Plata","Pedernales","Peravia","Puerto Plata","Samaná","San Cristóbal","San José de Ocoa","San Juan","San Pedro de Macorís","Sánchez Ramírez","Santiago","Santiago Rodríguez","Santo Domingo","Valverde"];
  // Sectores que cargó el administrador (en la versión real vienen de la base de datos; aquí son de ejemplo).
  const SECTORES={"Distrito Nacional":["Gualey","Capotillo","Cristo Rey","Villa Juana","Los Guandules"],"Santo Domingo":["Los Mina","Villa Mella","Los Alcarrizos","Sabana Perdida","Invivienda"],"Santiago":["Cienfuegos","Pekín","Los Salados","Gurabo"],"La Vega":["Villa Rosa","Palmarito","Las Carolinas"],"San Cristóbal":["Madre Vieja","Canastica","Lavapiés"],"Puerto Plata":["Padre Granero","Los Domínguez","San Marcos"],"La Altagracia":["Juan Pablo Duarte","Villa Cerro","Friusa"],"Duarte":["Los Rieles","Vista al Valle","Pueblo Nuevo"]};
  const sectOpts=(pv,cur)=>{const l=SECTORES[pv]||[];return l.length?`<option value="">Elija el sector</option>`+l.map(x=>`<option ${cur===x?"selected":""}>${esc(x)}</option>`).join(""):`<option value="">No hay sectores cargados</option>`;};
  const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  let step=0, st={}, order=shuffle(CANDS), hechas=0;
  const REG={"00112345678":{nombre:"Juan Pérez",codigo:"482915",pin:null,estado:"Pendiente"},
             "40212345671":{nombre:"María Santos",codigo:null,pin:"731904",estado:"Activo"}};
  const weak=p=>/^(\d)\1{5}$/.test(p)||"0123456789".includes(p)||"9876543210".includes(p)||["123123","112233","121212"].includes(p);
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const radios=(name,opts,row)=>`<div class="opts${row==="two"?" two":row?" row":""}">${opts.map((o,i)=>`<label class="opt"><input type="radio" name="${name}" value="${esc(o)}" id="${name}-${i}" ${st[name]===o?"checked":""}>${esc(o)}</label>`).join("")}</div>`;
  const val=n=>{const e=document.querySelector(`input[name="${n}"]:checked`);return e?e.value:null;};

  const S=[
    {t:"Inicio de sesión",btn:()=>st.mode==="activar"?"Activar cuenta":"Entrar",html:()=>{const act=st.mode==="activar";return `
      <div class="step">Acceso del encuestador</div><h2>${act?"Active su cuenta":"Entre con su cédula"}</h2>
      <div class="tabs" role="tablist"><button type="button" role="tab" id="tEnt" aria-selected="${!act}">Entrar</button><button type="button" role="tab" id="tAct" aria-selected="${act}">Activar mi cuenta</button></div>
      <div class="q"><label for="u">Su número de cédula</label><input type="tel" id="u" inputmode="numeric" placeholder="000-0000000-0" value="${esc(st.uc||"")}" autocomplete="off"></div>
      ${act?`<div class="q"><label for="code">Código de activación (se lo da el administrador)</label><input type="tel" id="code" inputmode="numeric" maxlength="6" placeholder="6 dígitos"></div>
      <div class="q"><label for="p">Cree su PIN de 6 dígitos</label><input type="password" id="p" inputmode="numeric" maxlength="6"></div>
      <div class="q"><label for="p2">Repita el PIN</label><input type="password" id="p2" inputmode="numeric" maxlength="6"></div>
      <p class="small">No use PIN fáciles como 123456, 000000 o su fecha de nacimiento. Nadie más debe conocer su PIN, ni el administrador.</p>`
      :`<div class="q"><label for="p">PIN de 6 dígitos</label><input type="password" id="p" inputmode="numeric" maxlength="6"></div>
      <p class="small">¿Primera vez? Toque <b>Activar mi cuenta</b> y use el código que le dio el administrador.</p>`}
      <p class="err" id="e" hidden></p>
      <div class="hint"><b>Para probar esta vista previa:</b><br>Activar: cédula <b>001-1234567-8</b>, código <b>482915</b> (Juan Pérez).<br>Entrar ya activa: cédula <b>402-1234567-1</b>, PIN <b>731904</b> (María Santos).</div>`;},
      after:()=>{const c=$("u");c.addEventListener("input",()=>{const d=c.value.replace(/\D/g,"").slice(0,11);c.value=d.length>10?`${d.slice(0,3)}-${d.slice(3,10)}-${d.slice(10)}`:d.length>3?`${d.slice(0,3)}-${d.slice(3)}`:d;});
        $("tEnt").addEventListener("click",()=>{st.uc=$("u").value;st.mode="entrar";show();});
        $("tAct").addEventListener("click",()=>{st.uc=$("u").value;st.mode="activar";show();});},
      save:()=>{const err=m=>{$("e").textContent=m;$("e").hidden=false;return false;};
        const d=$("u").value.replace(/\D/g,"");st.uc=$("u").value;
        if(d.length!==11)return err("Escriba su cédula completa (11 dígitos).");
        const r=REG[d];if(!r)return err("Esta cédula no está registrada como encuestador. Hable con el administrador.");
        if(r.estado==="Bloqueado")return err("Su cuenta está bloqueada. Hable con el administrador.");
        const pin=$("p").value;
        if(st.mode==="activar"){
          if(r.pin)return err("Esta cuenta ya está activa. Toque Entrar.");
          if($("code").value!==r.codigo)return err("El código de activación no es correcto.");
          if(!/^\d{6}$/.test(pin))return err("El PIN debe tener 6 números.");
          if(weak(pin))return err("Ese PIN es muy fácil de adivinar. Elija otro.");
          if(pin!==$("p2").value)return err("Los dos PIN no coinciden.");
          r.pin=pin;r.codigo=null;
        } else {
          if(!r.pin)return err("Su cuenta todavía no está activa. Toque Activar mi cuenta.");
          if(pin!==r.pin)return err("PIN incorrecto.");
        }
        st.u=r.nombre;st.mode="entrar";$("who").textContent=st.u+" · "+hechas+" hoy";return true;}},
    {t:"Consentimiento",btn:"Continuar",html:()=>`
      <div class="step">Paso 1 de 4</div><h2>Lea a la persona</h2>
      <p class="read">“Buenos días/tardes. Estamos haciendo una consulta interna del PRM sobre preferencias presidenciales. Es voluntaria y sus respuestas se usarán solo para fines estadísticos. ¿Acepta participar y que se tome una foto de su cédula para confirmar la entrevista?”</p>
      <label class="opt"><input type="checkbox" id="acepta" ${st.acepta?"checked":""}>Acepta participar</label>
      <label class="opt"><input type="checkbox" id="foto" ${st.foto?"checked":""}>Acepta foto de la cédula</label>
      <p class="err" id="e" hidden>Sin consentimiento no se puede hacer la consulta.</p>`,
      save:()=>{st.acepta=$("acepta").checked;st.foto=$("foto").checked;if(!st.acepta){$("e").hidden=false;return false;}return true;}},
    {t:"Datos",btn:"Siguiente",html:()=>`
      <div class="step">Paso 2 de 4</div><h2>Datos de la persona</h2>
      <div class="gps">Ubicación y hora registradas</div>
      <div class="q"><label for="prov">Provincia</label><select id="prov"><option value="">Elija la provincia</option>${PROVS.map(p=>`<option ${st.prov===p?"selected":""}>${p}</option>`).join("")}</select></div>
      <div class="q"><label for="sect">Sector o barrio</label><select id="sect">${st.prov?sectOpts(st.prov,st.sect):`<option value="">Primero elija la provincia</option>`}</select>
        <p class="small" id="sinSect" ${st.prov&&!(SECTORES[st.prov]||[]).length?"":"hidden"}>Esta provincia todavía no tiene sectores. Pida al administrador que los agregue.</p></div>
      <div class="q"><label for="calle">Calle</label><input type="text" id="calle" placeholder="Ej.: Calle Principal" value="${esc(st.calle||"")}"></div>
      <div class="q"><span class="ql">Sexo</span>${radios("sexo",["Femenino","Masculino"],true)}</div>
      <div class="q"><span class="ql">Edad</span>${radios("edad",["18–35","36–45","46–59","60 o más"],"two")}</div>
      <div class="q"><span class="ql">¿Es miembro o está inscrito en el PRM?</span>${radios("miembro",["Sí","No"],true)}</div>
      <div class="q" id="insQ" ${st.miembro==="No"?"":"hidden"}><span class="ql">¿Desea inscribirse en el partido?</span>${radios("ins",["Sí","No"],true)}
        <div id="insBox" ${st.ins==="Sí"?"":"hidden"} style="display:grid;gap:8px;margin-top:8px">

          <label class="opt"><input type="checkbox" id="insConf" ${st.insConf?"checked":""}>Inscripción confirmada</label>
          <p class="small">Marque esta casilla solo cuando la página oficial del partido muestre que la persona quedó inscrita. Si no terminó, déjela sin marcar.</p></div></div>
      <p class="err" id="e" hidden>Complete provincia, sector, calle y todas las opciones.</p>`,
      after:()=>{$("prov").addEventListener("change",()=>{const pv=$("prov").value;$("sect").innerHTML=pv?sectOpts(pv,""):`<option value="">Primero elija la provincia</option>`;$("sinSect").hidden=!pv||(SECTORES[pv]||[]).length>0;});
        document.querySelectorAll('input[name=miembro]').forEach(r=>r.addEventListener("change",()=>{$("insQ").hidden=val("miembro")!=="No";}));
        document.querySelectorAll('input[name=ins]').forEach(r=>r.addEventListener("change",()=>{$("insBox").hidden=val("ins")!=="Sí";}));},
      save:()=>{Object.assign(st,{prov:$("prov").value,sect:$("sect").value,calle:$("calle").value.trim(),sexo:val("sexo"),edad:val("edad"),miembro:val("miembro"),ins:val("ins"),insConf:val("miembro")==="No"&&val("ins")==="Sí"&&$("insConf").checked});
        const ok=st.prov&&st.sect&&st.calle&&st.sexo&&st.edad&&st.miembro&&(st.miembro==="Sí"||st.ins);if(!ok)$("e").hidden=false;return !!ok;}},
    {t:"Preferencia",btn:"Siguiente",html:()=>`
      <div class="step">Paso 3 de 4</div><h2>¿Cuál de estos aspirantes prefiere como candidato presidencial del PRM?</h2>
      ${radios("pref",[...order,"Ninguno"])}
      <p class="err" id="e" hidden>Elija una opción.</p>`,
      save:()=>{st.pref=val("pref");if(!st.pref)$("e").hidden=false;return !!st.pref;}},
    {t:"Cédula",btn:"Enviar consulta",html:()=>`
      <div class="step">Paso 4 de 4</div><h2>Cédula</h2>
      <div class="q"><label for="nom">Nombre y apellido (como aparece en la cédula)</label><input type="text" id="nom" placeholder="Ej.: María Rodríguez Pérez" value="${esc(st.nom||"")}" autocomplete="off"></div>
      <div class="q"><label for="ced">Número de cédula de la persona consultada</label><input type="tel" id="ced" placeholder="000-0000000-0" value="${esc(st.ced||"")}" inputmode="numeric"></div>
      <p class="small">La app guarda solo un código del número para evitar que la misma persona participe dos veces.</p>
      ${st.foto?[["F","Frente de la cédula"],["B","Parte trasera de la cédula"]].map(([k,t])=>`<div class="q"><span class="ql">${t}</span>
        <div class="photo" id="ph${k}">${st["img"+k]?`<img src="${st["img"+k]}" alt="${t}">`:"Todavía no hay foto"}</div>
        <p class="size" id="sz${k}" ${st["img"+k]?"":"hidden"}>${esc(st["sz"+k]||"")}</p>
        <div class="photo-btns"><button type="button" class="cam" id="bCam${k}">${st["img"+k]?"Repetir foto":"Tomar foto"}</button><button type="button" id="bGal${k}">Elegir de la galería</button></div>
        <input type="file" id="fileCam${k}" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true"><input type="file" id="fileGal${k}" class="vh" accept="image/*" tabindex="-1" aria-hidden="true"></div>`).join("")+`<p class="small">"Tomar foto" abre la cámara dentro de la app, sin salir de la consulta. Si el teléfono no lo permite, abre la cámara del teléfono o la carpeta de archivos.</p><p class="err" id="eF" hidden>Falta la foto del frente o de la parte trasera.</p>`:`<p class="small">La persona no aceptó la foto. Se envía sin foto.</p>`}
      <p class="err" id="e" hidden>Escriba el nombre y apellido, y los 11 dígitos de la cédula.</p>`,
      after:()=>{const ced=$("ced");ced.addEventListener("input",()=>{const d=ced.value.replace(/\D/g,"").slice(0,11);ced.value=d.length>10?`${d.slice(0,3)}-${d.slice(3,10)}-${d.slice(10)}`:d.length>3?`${d.slice(0,3)}-${d.slice(3)}`:d;});
        ["F","B"].forEach(k=>{const fc=$("fileCam"+k),fg=$("fileGal"+k);if(!fc)return;
        const keep=()=>{st.ced=$("ced").value;st.nom=$("nom").value.trim();saveState();};
        $("bCam"+k).addEventListener("click",()=>{keep();openCam(k,()=>fc.click());});$("bGal"+k).addEventListener("click",()=>{keep();fg.click();});
        const take=(inp)=>{const file=inp.files[0];if(!file)return;$("ph"+k).textContent="Procesando foto…";
          let url=URL.createObjectURL(file),retried=false;const im=new Image();
          im.onload=()=>{try{const max=1200,escala=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*escala);c.height=Math.round(im.height*escala);
            c.getContext("2d").drawImage(im,0,0,c.width,c.height);if(url.startsWith("blob:"))URL.revokeObjectURL(url);
            fin(k,c,file.size);inp.value="";
            }catch(err){$("ph"+k).textContent="No se pudo procesar la foto. Tómela otra vez.";}};
          im.onerror=()=>{if(!retried){retried=true;const r=new FileReader();r.onload=()=>{url=r.result;im.src=url;};r.onerror=()=>{$("ph"+k).textContent="No se pudo abrir esa imagen. Pruebe con otra foto.";};r.readAsDataURL(file);}
            else $("ph"+k).textContent="No se pudo abrir esa imagen. Pruebe con otra foto.";};im.src=url;};
        fc.addEventListener("change",()=>take(fc));fg.addEventListener("change",()=>take(fg));});},
      save:()=>{st.ced=$("ced").value;st.nom=$("nom").value.trim();const ok=st.ced.replace(/\D/g,"").length===11&&st.nom.split(/\s+/).length>=2;if(!ok)$("e").hidden=false;
        const fotos=!st.foto||(st.imgF&&st.imgB);if(!fotos)$("eF").hidden=false;return ok&&!!fotos;}},
    {t:"Enviada",btn:"Nueva consulta",html:()=>`
      <div class="done"><div class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--ok)"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2>Consulta guardada</h2><p>Gracias por participar.</p>
      <div class="step">Consultas enviadas hoy</div><div class="counter">${hechas}</div>
      <p class="small">En la app real, si no hay internet, la consulta se guarda en el celular y se envía sola al volver la señal.</p></div>`,
      save:()=>{st={u:st.u,uc:st.uc,mode:"entrar"};order=shuffle(CANDS);return true;}}
  ];

  // Termina una foto: la comprime, la muestra y guarda el avance.
  function fin(k,c,orig){let q=0.7,data=c.toDataURL("image/jpeg",q);while(data.length*0.75>120000&&q>0.3){q-=0.1;data=c.toDataURL("image/jpeg",q);}
    const kb=Math.round(data.length*0.75/1024);
    st["img"+k]=data;st["sz"+k]=`Foto lista: ${kb} KB`+(orig?` (original ${orig>1048576?(orig/1048576).toFixed(1)+" MB":Math.round(orig/1024)+" KB"})`:"");
    const ph=$("ph"+k);if(ph){ph.replaceChildren();const out=new Image();out.src=data;out.alt="Foto de la cédula";ph.append(out);
      $("sz"+k).textContent=st["sz"+k];$("sz"+k).hidden=false;$("bCam"+k).textContent="Repetir foto";}
    const ef=$("eF");if(ef&&st.imgF&&st.imgB)ef.hidden=true;saveState();}
  // Cámara dentro de la página: no se sale de la app, así el teléfono no la cierra.
  let camFallo=false;
  async function openCam(k,fallback){
    const enMarco=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
    if(enMarco||camFallo||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fallback();return;}
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});}
    catch(e){camFallo=true;const ph=$("ph"+k);if(ph)ph.textContent="No se pudo abrir la cámara de la app. Toque “Tomar foto” otra vez para usar la cámara del teléfono, o use “Elegir de la galería”.";return;}
    const ov=document.createElement("div");ov.className="cam-ov";ov.setAttribute("role","dialog");ov.setAttribute("aria-label","Cámara");
    ov.innerHTML=`<div class="cam-t">${k==="F"?"Frente":"Parte trasera"} de la cédula</div><div class="cam-box"><video playsinline muted autoplay></video><div class="cam-guide"><span class="cam-dim">Cédula · 85.60 × 53.98 mm</span></div></div><p class="cam-h">Ponga la cédula dentro del recuadro, con buena luz, y toque Capturar.</p><div class="cam-b"><button type="button" class="cx">Cancelar</button><button type="button" class="pri cc">Capturar</button></div>`;
    document.body.append(ov);const v=ov.querySelector("video");v.srcObject=stream;
    const close=()=>{stream.getTracks().forEach(t=>t.stop());ov.remove();};
    ov.querySelector(".cx").addEventListener("click",close);
    // Al capturar, recorta solo lo que está dentro de la guía, con la proporción exacta de la cédula (85.60 × 53.98 mm).
    ov.querySelector(".cc").addEventListener("click",()=>{if(!v.videoWidth)return;
      const vr=v.getBoundingClientRect(),gr=ov.querySelector(".cam-guide").getBoundingClientRect();
      const s2=Math.min(vr.width/v.videoWidth,vr.height/v.videoHeight);
      const ox=vr.left+(vr.width-v.videoWidth*s2)/2, oy=vr.top+(vr.height-v.videoHeight*s2)/2;
      let sx=(gr.left-ox)/s2, sy=(gr.top-oy)/s2, sw=gr.width/s2, sh=gr.height/s2;
      sx=Math.max(0,sx); sy=Math.max(0,sy); sw=Math.min(sw,v.videoWidth-sx); sh=Math.min(sh,v.videoHeight-sy);
      const c=document.createElement("canvas"); c.width=1000; c.height=Math.round(1000*53.98/85.6);
      c.getContext("2d").drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
      close();fin(k,c,null);});
  }
  // Guarda el avance en el celular para que, si el teléfono recarga la página al abrir la cámara, se vuelva al mismo paso.
  const KEY="consultaPRM_avance", HORAS=8;
  function saveState(){try{localStorage.setItem(KEY,JSON.stringify({t:Date.now(),step,st,order,hechas,
    pins:Object.fromEntries(Object.entries(REG).filter(([,r])=>r.pin).map(([k,r])=>[k,r.pin]))}));}catch(e){}}
  function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!x||Date.now()-x.t>HORAS*3600e3){localStorage.removeItem(KEY);return false;}
    Object.entries(x.pins||{}).forEach(([k,p])=>{if(REG[k]){REG[k].pin=p;REG[k].codigo=null;}});
    if(!x.st||!x.st.u)return false;
    step=x.step||1;st=x.st;order=x.order||order;hechas=x.hechas||0;$("who").textContent=st.u+" · "+hechas+" hoy";return true;}catch(e){return false;}}
  function show(){
    const s=S[step]; $("screen").innerHTML=s.html(); if(s.after)s.after();
    $("next").textContent=typeof s.btn==="function"?s.btn():s.btn; $("back").hidden=(step<=1||step===S.length-1);
    $("bar").style.width=(step===0?0:Math.min(step/4,1)*100)+"%";
    $("screen").scrollTop=0; const first=$("screen").querySelector("input,select"); if(first&&step>0&&step!==4)first.focus({preventScroll:true});
    if(step>0)saveState();
  }
  $("next").addEventListener("click",()=>{
    if(!S[step].save())return;
    if(step===4){hechas++;$("who").textContent=st.u+" · "+hechas+" hoy";}
    step = step===S.length-1 ? 1 : step+1; show(); $("app").scrollIntoView({block:"start",behavior:"smooth"});
  });
  $("back").addEventListener("click",()=>{if(step>1){step--;show();}});
  $("app").addEventListener("submit",e=>e.preventDefault());
  const volvio=loadState();
  show();
  if(volvio&&step===4){const n=document.createElement("p");n.className="hint";n.textContent="Se recuperó la consulta en curso. Si la foto no aparece, tómela otra vez o use “Elegir de la galería”.";$("screen").prepend(n);}
})();
</script>
